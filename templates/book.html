<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fb;
        }

        .card{
            margin-top:50px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,.15);
        }

        h2{
            color:#0d6efd;
            font-weight:bold;
        }

        .btn-primary{
            width:100%;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Book Appointment
                    </h2>

                    <form method="POST" action="/book">

                        <div class="mb-3">

                            <label class="form-label">
                                Select Available Schedule
                            </label>

                            <select
                                name="schedule_id"
                                class="form-select"
                                required>

                                <option value="">
                                    -- Select Appointment --
                                </option>

                                {% if schedules %}

                                    {% for s in schedules %}

                                    <option value="{{ s[0] }}">

                                        Dr. {{ s[1] }}
                                        | {{ s[2] }}
                                        | {{ s[3] }}
                                        | {{ s[4] }} - {{ s[5] }}

                                    </option>

                                    {% endfor %}

                                {% else %}

                                    <option disabled>
                                        No appointments available
                                    </option>

                                {% endif %}

                            </select>

                        </div>

                        <button
                            class="btn btn-primary"
                            type="submit">

                            Book Appointment

                        </button>

                    </form>

                    <hr>

                    <div class="text-center">

                        <a
                            href="/dashboard"
                            class="btn btn-secondary">

                            Back to Dashboard

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
